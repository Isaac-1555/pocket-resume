<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

</head>
<body>
<div class="canvas">
    <div class="glow cyan" style="width:560px;height:560px;right:60px;top:-180px;"></div>
    <div class="glow amber" style="width:380px;height:380px;left:-140px;bottom:-160px;opacity:.6;"></div>

    <div class="lockup">
        <img src="../../icon.png" alt="">
        <span class="name">PocketResume</span>
    </div>

    <div style="position:absolute;left:48px;top:230px;width:450px;z-index:5;">

    <div class="frame" style="right:52px;top:255px;width:700px;height:290px;">
        <img class="shot" src="../captures/tracker.png" alt="" style="width:1050px;height:auto;object-fit:cover;object-position:top left;">
