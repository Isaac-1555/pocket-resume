<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tiles.css">
</head>
<body>
<div class="tile" style="width:1400px;height:560px;">
    <div class="glow amber" style="width:640px;height:640px;right:140px;top:-260px;"></div>
    <div class="glow cyan" style="width:480px;height:480px;left:-180px;bottom:-240px;opacity:.55;"></div>

    <div class="lockup" style="top:32px;left:44px;">
        <img src="../../icon.png" alt="" style="width:32px;height:32px;">
        <span class="name" style="font-size:19px;">PocketResume</span>
    </div>

    <div style="position:absolute;left:48px;top:138px;width:660px;z-index:5;">
        <div class="eyebrow amber" style="font-size:12px;margin-bottom:20px;">Tailor any job post in seconds</div>
        <div class="display" style="font-size:56px;">One click.<br>One <span class="accent-a">tailored</span> resume.</div>
        <p class="sub" style="font-size:17px;margin-top:20px;max-width:540px;">Open a job posting, press Generate. PocketResume rewrites your master resume for that exact role — and hands you a polished PDF.</p>
        <div class="chips" style="margin-top:26px;font-size:11px;padding:7px 13px;">
            <span class="chip" style="font-size:11px;padding:7px 13px;">Gemini</span>
            <span class="chip" style="font-size:11px;padding:7px 13px;">GPT</span>
            <span class="chip" style="font-size:11px;padding:7px 13px;">Claude</span>
            <span class="chip" style="font-size:11px;padding:7px 13px;">Local models</span>
        </div>
    </div>

    <div class="page" style="right:306px;top:100px;width:206px;height:266px;transform:rotate(-6deg);z-index:2;">
        <img src="../captures/resume-professional.png" alt="">
    </div>
    <div class="frame" style="right:96px;top:66px;width:264px;height:417px;">
        <img class="shot" src="../captures/popup-idle.png" alt="">
    </div>
    <div class="glow amber" style="width:360px;height:360px;right:40px;top:130px;opacity:.4;"></div>

    <div class="footer" style="left:48px;bottom:28px;font-size:11px;">Made for Chrome &middot; Your keys, your data</div>
</div>
</body>
</html>
