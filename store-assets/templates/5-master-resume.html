<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div class="canvas">
    <div class="glow cyan" style="width:520px;height:520px;right:80px;top:-180px;"></div>
    <div class="glow amber" style="width:400px;height:400px;left:-150px;bottom:-160px;opacity:.6;"></div>

    <div class="lockup">
        <img src="../../icon.png" alt="">
        <span class="name">PocketResume</span>
    </div>

    <div style="position:absolute;left:48px;top:196px;width:440px;z-index:5;">
        <div class="eyebrow cyan">Paste once</div>
        <h1 class="display" style="font-size:52px;">Your master resume,<br><span class="accent-c">in a real form.</span></h1>
        <p class="sub" style="max-width:430px;">Paste the resume you already have. The local parser splits it into editable fields &mdash; header, summary, skills, roles, projects, education.</p>
        <div class="chips">
            <span class="chip">Local parser</span>
            <span class="chip">No upload</span>
            <span class="chip">Fully editable</span>
        </div>
    </div>

    <div class="frame" style="right:36px;top:48px;width:730px;height:704px;">
        <img class="shot" src="../captures/resume-form.png" alt="" style="object-position:top left;">
    </div>

    <div class="footer">Parsed on your device &middot; Nothing leaves the browser</div>
</div>
</body>
</html>
