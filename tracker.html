<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PocketResume — Job Tracker</title>
  <style>
    :root {
      --bg: #050506;

      --glass-fill: rgba(255, 255, 255, 0.055);
      --glass-fill-strong: rgba(255, 255, 255, 0.09);
      --glass-border: rgba(255, 255, 255, 0.14);
      --glass-highlight: rgba(255, 255, 255, 0.35);

      --text: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.52);
      --text-faint: rgba(255, 255, 255, 0.32);

      --orange: #f4933b;
      --orange-fill: rgba(244, 147, 59, 0.16);
      --orange-fill-strong: rgba(244, 147, 59, 0.30);
      --orange-border: rgba(244, 147, 59, 0.55);

      --blue: #3884ff;
      --green: #2bd684;
      --red: #ff5656;
      --yellow: #d29922;
      --purple: #a371f7;

      --panel: var(--glass-fill);
      --panel-2: rgba(255, 255, 255, 0.07);
      --border: var(--glass-border);
      --border-strong: rgba(255, 255, 255, 0.22);
      --accent: var(--orange);
      --accent-2: var(--blue);

      --radius: 16px;
      --radius-sm: 10px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Inter, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      position: relative;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      --glow-c: 20, 20, 22;
      --glow-o: 0.7;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse farthest-corner at 50% 50%,
        rgba(var(--glow-c), var(--glow-o)),
        rgba(var(--glow-c), calc(var(--glow-o) * 0.45)) 55%,
        rgba(var(--glow-c), calc(var(--glow-o) * 0.12)) 100%);
      opacity: 0.8;
      pointer-events: none;
      z-index: 0;
    }

    header.app-header,
    .lock-banner,
    .board-wrap,
    .graph-wrap {
      position: relative;
      z-index: 1;
    }

    header.app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 22px;
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(10, 10, 12, 0.75);
      backdrop-filter: blur(20px) saturate(150%);
      -webkit-backdrop-filter: blur(20px) saturate(150%);
      border-bottom: 1px solid var(--glass-border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand .logo {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: linear-gradient(155deg, #2a1810, #150c07 55%);
      border: 1px solid rgba(255, 255, 255, 0.10);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
      overflow: hidden;
      flex-shrink: 0;
    }

    .brand .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .brand h1 {
      font-size: 16px;
      margin: 0;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand h1 span {
      color: var(--text-muted);
      font-weight: 400;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .plan-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid var(--glass-border);
      background: var(--glass-fill);
      color: var(--text-muted);
      white-space: nowrap;
    }

    .plan-badge.locked { color: var(--yellow); border-color: rgba(210, 153, 34, 0.5); background: rgba(210, 153, 34, 0.08); }
    .plan-badge.trial { color: var(--orange); border-color: var(--orange-border); background: var(--orange-fill); }
    .plan-badge.pro { color: var(--green); border-color: rgba(43, 214, 132, 0.45); background: rgba(43, 214, 132, 0.08); }

    .plan-loader {
      flex-shrink: 0;
    }

    .btn {
      appearance: none;
      font: inherit;
      font-size: 13px;
      font-weight: 500;
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid var(--glass-border);
      background: var(--glass-fill);
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s var(--ease);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: inset 0 1px 0 var(--glass-highlight), inset 0 -1px 0 rgba(0, 0, 0, 0.25);
    }

    .btn:hover {
      border-color: rgba(255, 255, 255, 0.24);
      background: var(--glass-fill-strong);
    }

    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

    .btn-primary {
      background: linear-gradient(160deg, rgba(255, 150, 60, 0.32), rgba(244, 110, 30, 0.18));
      border: 1px solid var(--orange-border);
      color: var(--text);
      font-weight: 600;
      box-shadow: inset 0 1px 0 rgba(255, 210, 160, 0.45),
                  inset 0 -10px 18px rgba(180, 70, 10, 0.16),
                  0 0 20px rgba(244, 147, 59, 0.2),
                  0 6px 16px rgba(0, 0, 0, 0.35);
    }

    .btn-primary:hover {
      background: linear-gradient(160deg, rgba(255, 150, 60, 0.42), rgba(244, 110, 30, 0.24));
      border-color: rgba(244, 147, 59, 0.75);
      filter: none;
    }

    .btn-ghost {
      background: transparent;
      border-color: transparent;
      color: var(--text-muted);
      padding: 8px;
      box-shadow: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }

    .btn-ghost:hover { background: var(--glass-fill-strong); color: var(--text); border-color: transparent; }

    /* View switch */
    .view-tabs {
      display: flex;
      gap: 4px;
      background: var(--glass-fill);
      border: 1px solid var(--glass-border);
      border-radius: 11px;
      padding: 3px;
      box-shadow: inset 0 1px 0 var(--glass-highlight);
    }

    .view-tab {
      appearance: none;
      font: inherit;
      font-size: 12.5px;
      font-weight: 500;
      padding: 6px 14px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s var(--ease);
    }

    .view-tab:hover { color: var(--text); }

    .view-tab.active {
      background: var(--orange-fill);
      color: var(--orange);
      font-weight: 600;
    }

    /* Lock banner */
    .lock-banner {
      display: none;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin: 18px 22px 0;
      padding: 14px 18px;
      border: 1px solid rgba(210, 153, 34, 0.45);
      border-radius: var(--radius);
      background: rgba(210, 153, 34, 0.08);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    .lock-banner.visible { display: flex; }

    .lock-banner .lock-title { font-size: 14px; font-weight: 600; color: var(--yellow); margin: 0 0 3px; }
    .lock-banner .lock-text { font-size: 12.5px; color: var(--text-muted); margin: 0; }

    .lock-banner .lock-actions { display: flex; gap: 8px; flex-shrink: 0; }

    /* Board */
    .board-wrap { padding: 18px 22px; display: grid; grid-template-columns: repeat(auto-fit, minmax(215px, 1fr)); gap: 14px; }

    .board-column {
      background: var(--glass-fill);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      min-height: 160px;
      display: flex;
      flex-direction: column;
      padding: 10px;
      box-shadow: inset 0 1px 0 var(--glass-highlight), inset 0 -1px 0 rgba(0, 0, 0, 0.25), 0 10px 24px rgba(0, 0, 0, 0.3);
      transition: border-color 0.2s var(--ease), background 0.2s var(--ease);
    }

    .board-column.drag-over {
      border-color: var(--accent-2);
      background: rgba(56, 132, 255, 0.08);
    }

    .column-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 2px 4px 10px;
    }

    .column-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .column-title {
      font-size: 13px;
      font-weight: 600;
      text-transform: capitalize;
    }

    .column-count {
      margin-left: auto;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.07);
      border-radius: 999px;
      padding: 2px 8px;
      min-width: 22px;
      text-align: center;
    }

    .column-cards {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 20px;
      flex: 1;
    }

    .card {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      padding: 10px 12px;
      cursor: grab;
      transition: all 0.2s var(--ease);
      user-select: none;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22);
    }

    .card:hover {
      border-color: rgba(255, 255, 255, 0.24);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.22);
    }

    .card.dragging {
      opacity: 0.45;
      transform: rotate(1.5deg);
    }

    .card.locked-card { cursor: pointer; }

    .card-company {
      font-size: 13.5px;
      font-weight: 600;
      margin: 0 0 2px;
      word-break: break-word;
    }

    .card-role {
      font-size: 12.5px;
      color: var(--text-muted);
      margin: 0 0 6px;
      word-break: break-word;
    }

    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .card-tag {
      font-size: 10.5px;
      font-weight: 500;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.07);
      color: var(--text-muted);
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-tag.accent { background: var(--orange-fill); color: var(--orange); }
    .card-tag.link { text-decoration: underline; cursor: pointer; }
    .card-tag.link:hover { color: var(--accent-2); }

    .round-control { display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; color: var(--text-muted); }
    .round-control select { font: inherit; color: var(--purple); background: rgba(163, 113, 247, 0.12); border: 1px solid rgba(163, 113, 247, 0.35); border-radius: 999px; padding: 2px 5px; }
    .round-control select:focus { outline: none; border-color: var(--purple); }

    .empty-state {
      font-size: 12px;
      color: var(--text-faint);
      text-align: center;
      padding: 18px 8px;
      border: 1px dashed rgba(255, 255, 255, 0.14);
      border-radius: 8px;
    }

    /* Graph view */
    .graph-wrap { padding: 18px 22px; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }

    .graph-card {
      background: var(--glass-fill);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      padding: 18px;
      align-self: start;
      box-shadow: inset 0 1px 0 var(--glass-highlight), inset 0 -1px 0 rgba(0, 0, 0, 0.25), 0 10px 24px rgba(0, 0, 0, 0.3);
    }

    .graph-card h2 {
      font-size: 14px;
      font-weight: 600;
      margin: 0 0 14px;
    }

    .graph-card .sub { font-size: 12px; color: var(--text-muted); margin: -8px 0 14px; font-weight: 400; }

    svg text { font-family: var(--font); }

    .legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

    .legend-item { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-muted); }

    .legend-dot { width: 9px; height: 9px; border-radius: 50%; }

    /* Pipeline Sankey */
    .graph-card.wide { grid-column: 1 / -1; }
    .timeline-card { grid-column: 2 / -1; align-self: stretch; overflow-x: auto; }

    .graph-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .graph-head h2 { margin: 0 0 4px; }
    .graph-head .sub { margin: 0; }

    .filter-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }

    .filter-bar input[type="text"], .filter-bar select, .filter-bar input[type="date"] {
      font: inherit;
      font-size: 12.5px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.055);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      padding: 6px 9px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14);
      transition: border-color 0.2s var(--ease);
    }

    .filter-bar input[type="text"] { width: 180px; }
    .filter-bar input:focus, .filter-bar select:focus { outline: none; border-color: var(--orange-border); }
    .range-label { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-muted); }

    .sanky-wrap { position: relative; overflow-x: auto; }
    .sanky { display: block; width: 100%; height: 380px; min-width: 960px; }
    .timeline-svg { display: block; width: 100%; height: auto; }
    .sanky text { font-family: var(--font); }

    .sanky-node { cursor: pointer; }
    .sanky-node rect { transition: opacity 0.2s var(--ease); }
    .sanky-node:hover rect { fill-opacity: 0.26; }

    .sanky-link { cursor: pointer; }
    .sanky-link:hover { fill-opacity: 0.5; }

    .sanky-tip {
      position: absolute;
      z-index: 40;
      pointer-events: none;
      background: rgba(10, 10, 12, 0.94);
      backdrop-filter: blur(20px) saturate(150%);
      -webkit-backdrop-filter: blur(20px) saturate(150%);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 12px;
      color: var(--text);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 12px 28px rgba(0, 0, 0, 0.5);
      white-space: nowrap;
      display: none;
    }

    .metrics-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; }
    .metric-tile {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      padding: 11px 12px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22);
    }
    .metric-value { font-size: 20px; font-weight: 700; color: var(--text); line-height: 1.1; }
    .metric-label { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
    .metric-sub { font-size: 10px; opacity: 0.7; }

    .drill-panel { margin-top: 14px; border-top: 1px solid var(--glass-border); padding-top: 12px; }
    .drill-title { font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; }
    .drill-list { display: grid; gap: 6px; max-height: 220px; overflow-y: auto; }
    .drill-row {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      text-align: left;
      background: rgba(255, 255, 255, 0.055);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      font: inherit;
      font-size: 12.5px;
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s var(--ease);
    }
    .drill-row:hover { border-color: rgba(255, 255, 255, 0.24); background: var(--glass-fill-strong); }
    .drill-company { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .drill-role { color: var(--text-muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .drill-status { margin-left: auto; font-size: 11px; font-weight: 600; flex-shrink: 0; }
    .drill-empty { font-size: 12px; color: var(--text-muted); padding: 8px; }

    /* Modal: interview rounds + dates */
    .field.row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .field.row3 .mini-field label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); margin-bottom: 5px; }
    .field.row3 .mini-field input { width: 100%; font: inherit; font-size: 13px; color: var(--text); background: rgba(255, 255, 255, 0.055); border: 1px solid var(--glass-border); border-radius: 8px; padding: 8px 10px; }
    .field.row3 .mini-field input:focus { outline: none; border-color: var(--orange-border); }

    .round-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .round-num {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(163, 113, 247, 0.15);
      color: var(--purple);
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .round-row input { flex: 1; }
    .field-hint { font-size: 11px; color: var(--text-muted); margin: -2px 0 8px; }
    .round-rm { background: none; border: none; color: var(--text-muted); font-size: 16px; cursor: pointer; padding: 2px 6px; border-radius: 6px; }
    .round-rm:hover { color: var(--red); background: rgba(255, 86, 86, 0.1); }
    .add-round-btn { font-size: 12px; }

    .flags { display: flex; flex-wrap: wrap; gap: 8px 16px; }
    .flag { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text); cursor: pointer; }
    .flag input { accent-color: var(--orange); }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(3, 3, 4, 0.72);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 16px;
      z-index: 50;
      overflow-y: auto;
    }

    .modal-overlay.open { display: flex; }

    .modal {
      background: linear-gradient(165deg, rgba(30, 28, 26, 0.92), rgba(12, 11, 10, 0.95));
      backdrop-filter: blur(24px) saturate(150%);
      -webkit-backdrop-filter: blur(24px) saturate(150%);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      max-width: 520px;
      width: 100%;
      padding: 22px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 24px 60px rgba(0, 0, 0, 0.6);
    }

    .modal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .modal-head h2 { font-size: 16px; margin: 0; word-break: break-word; }
    .modal-close { background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; padding: 4px 8px; border-radius: 8px; }
    .modal-close:hover { background: var(--glass-fill-strong); color: var(--text); }

    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); margin-bottom: 5px; }

    .field input, .field select, .field textarea {
      width: 100%;
      font: inherit;
      font-size: 13px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.055);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      padding: 8px 10px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14);
      transition: border-color 0.2s var(--ease);
    }

    .field input:focus, .field select:focus, .field textarea:focus {
      outline: none;
      border-color: var(--orange-border);
    }

    .field select option {
      background: #141416;
      color: var(--text);
    }

    .field textarea { min-height: 80px; resize: vertical; }
    .field input[readonly], .field textarea[readonly] { opacity: 0.6; }

    .modal-actions { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; }
    .modal-actions .right { display: flex; gap: 8px; }
    .btn-danger { border-color: rgba(255, 86, 86, 0.45); color: var(--red); background: rgba(255, 86, 86, 0.08); box-shadow: none; }
    .btn-danger:hover { background: rgba(255, 86, 86, 0.16); border-color: rgba(255, 86, 86, 0.7); color: #ff8a8a; }

    .empty-board-note {
      text-align: center;
      padding: 70px 20px;
      color: var(--text-muted);
    }

    .empty-board-note h2 { font-size: 18px; margin: 0 0 6px; color: var(--text); }
    .empty-board-note p { font-size: 13.5px; margin: 0 0 18px; }

    .readonly-note {
      font-size: 11px;
      color: var(--yellow);
      margin-top: 6px;
    }

    /* Tour / onboarding */
    .tour-overlay { position: fixed; inset: 0; z-index: 1000; display: none; }
    .tour-catcher { position: absolute; inset: 0; cursor: default; }
    .tour-spotlight {
      position: absolute;
      pointer-events: none;
      box-shadow: 0 0 0 100vmax rgba(3, 3, 4, 0.6);
      transition: left 0.35s var(--ease), top 0.35s var(--ease), width 0.35s var(--ease), height 0.35s var(--ease), border-radius 0.35s var(--ease), opacity 0.25s var(--ease);
    }
    .tour-tip {
      position: fixed;
      z-index: 1001;
      width: 320px;
      max-width: calc(100vw - 24px);
      background: linear-gradient(165deg, rgba(30, 28, 26, 0.94), rgba(12, 11, 10, 0.96));
      backdrop-filter: blur(24px) saturate(150%);
      -webkit-backdrop-filter: blur(24px) saturate(150%);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      padding: 16px 18px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 20px 60px rgba(0, 0, 0, 0.55);
      pointer-events: auto;
      animation: tourIn 260ms var(--ease);
    }
    @keyframes tourIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .tour-tip h3 { margin: 0 0 6px; font-size: 15px; font-weight: 600; color: var(--text); }
    .tour-tip p { margin: 0 0 12px; font-size: 12.5px; line-height: 1.55; color: var(--text-muted); }
    .tour-progress { font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 10px; letter-spacing: 0.04em; }
    .tour-actions { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
    .tour-actions .btn { padding: 7px 14px; font-size: 12.5px; }
    #tourSkipBtn { margin-right: auto; }
    #tourReplayBtn { width: 32px; height: 32px; padding: 0; justify-content: center; border-radius: 999px; font-weight: 700; }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible,
    .view-tab:focus-visible {
      outline: 2px solid var(--orange);
      outline-offset: 2px;
    }

    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      border: 3px solid transparent;
      background-clip: content-box;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.2);
      border: 3px solid transparent;
      background-clip: content-box;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0ms !important;
        animation: none !important;
      }
    }

    @media (max-width: 720px) {
      header.app-header { flex-wrap: wrap; }
      .brand h1 span { display: none; }
      .timeline-card { grid-column: 1 / -1; }
      .timeline-svg { min-width: 560px; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="logo">
        <img src="icon.png" alt="">
      </span>
      <h1>Job Tracker <span>&middot; PocketResume</span></h1>
    </div>

    <div class="view-tabs" role="tablist">
      <button class="view-tab active" data-view="board" role="tab">Board</button>
      <button class="view-tab" data-view="graph" role="tab">Graph</button>
    </div>

    <div class="header-actions">
      <button class="btn btn-ghost" id="tourReplayBtn" title="Replay tour" aria-label="Replay tour">?</button>
      <l-newtons-cradle id="planLoader" class="plan-loader" size="26" color="#f4933b" speed="1.2"></l-newtons-cradle>
      <span class="plan-badge" id="planBadge" hidden></span>
      <button class="btn btn-primary" id="addBtn">+ Add job</button>
      <button class="btn" id="openSettingsBtn">Settings</button>
    </div>
  </header>

  <div class="lock-banner" id="lockBanner">
    <div>
      <p class="lock-title">Your 30-day trial has ended</p>
      <p class="lock-text">Your job tracker is now read-only. Upgrade to keep editing applications, dragging cards, and adding new jobs.</p>
    </div>
    <div class="lock-actions">
      <button class="btn btn-primary" id="upgradeBtn">Upgrade</button>
      <button class="btn" id="dismissLockBtn">Not now</button>
    </div>
  </div>

  <main id="boardView" class="board-wrap"></main>

  <main id="graphView" class="graph-wrap" style="display: none;"></main>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <h2 id="modalTitle">Application</h2>
        <button class="modal-close" id="modalCloseBtn" aria-label="Close">&times;</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <div class="tour-overlay" id="tourOverlay">
    <div class="tour-catcher" id="tourCatcher"></div>
    <div class="tour-spotlight" id="tourSpotlight"></div>
    <div class="tour-tip" id="tourTip" role="dialog" aria-modal="true" aria-labelledby="tourTitle">
      <h3 id="tourTitle"></h3>
      <p id="tourBody"></p>
      <div class="tour-progress" id="tourProgress"></div>
      <div class="tour-actions">
        <button class="btn btn-ghost" id="tourSkipBtn">Skip</button>
        <button class="btn btn-primary" id="tourNextBtn">Next</button>
      </div>
    </div>
  </div>

  <script src="cloud-sync.js"></script>
  <script src="libs/ldrs-newtons-cradle.js"></script>
  <script src="tracker.js"></script>
</body>
</html>
