<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PocketResume — Glass Redesign</title>
<style>
  :root{
    --bg: #050506;
    --glass-fill: rgba(255,255,255,0.055);
    --glass-fill-strong: rgba(255,255,255,0.09);
    --glass-border: rgba(255,255,255,0.14);
    --glass-highlight: rgba(255,255,255,0.35);
    --text: #ffffff;
    --text-dim: rgba(255,255,255,0.52);
    --text-faint: rgba(255,255,255,0.32);

    --orange: #f4933b;
    --orange-strong: #ff7a1a;
    --orange-fill: rgba(244,147,59,0.16);
    --orange-fill-strong: rgba(244,147,59,0.30);
    --orange-border: rgba(244,147,59,0.55);

    --glow-idle: 20,20,22;
    --glow-generating: 56,132,255;
    --glow-success: 43,214,132;
    --glow-failure: 255,86,86;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Inter, Helvetica, Arial, sans-serif;
    color: var(--text);
  }

  .stage {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 22px;
    padding: 48px 16px 64px;
  }

  /* ---------- Extension frame ---------- */
  .frame-wrap{
    position: relative;
    width: 380px;
  }

  .glow-layer{
    position: absolute;
    inset: -140px;
    border-radius: 50%;
    background: radial-gradient(closest-side, rgba(var(--glow-idle),0.6), rgba(var(--glow-idle),0.25) 45%, rgba(var(--glow-idle),0) 72%);
    filter: blur(50px);
    opacity: 0.6;
    transition: background 0.6s ease, opacity 0.6s ease;
    z-index: 0;
    pointer-events: none;
  }

  .frame-wrap[data-state="generating"] .glow-layer{
    background: radial-gradient(closest-side, rgba(var(--glow-generating),1), rgba(var(--glow-generating),0.5) 45%, rgba(var(--glow-generating),0) 75%);
    opacity: 1;
    animation: pulse 1.6s ease-in-out infinite;
  }
  .frame-wrap[data-state="success"] .glow-layer{
    background: radial-gradient(closest-side, rgba(var(--glow-success),1), rgba(var(--glow-success),0.5) 45%, rgba(var(--glow-success),0) 75%);
    opacity: 1;
    animation: settle 0.9s ease-out;
  }
  .frame-wrap[data-state="failure"] .glow-layer{
    background: radial-gradient(closest-side, rgba(var(--glow-failure),1), rgba(var(--glow-failure),0.5) 45%, rgba(var(--glow-failure),0) 75%);
    opacity: 1;
    animation: settle 0.9s ease-out;
  }

  @keyframes pulse{
    0%,100%{ opacity: 0.75; transform: scale(1); }
    50%{ opacity: 1; transform: scale(1.12); }
  }
  @keyframes settle{
    0%{ opacity: 0; transform: scale(0.85); }
    100%{ opacity: 1; transform: scale(1); }
  }

  .frame{
    position: relative;
    z-index: 1;
    width: 380px;
    border-radius: 28px;
    background:
      radial-gradient(120% 90% at 50% -10%, rgba(255,255,255,0.05), transparent 60%),
      var(--bg);
    border: 1px solid rgba(255,255,255,0.08);
    padding: 30px 22px 22px;
    overflow: hidden;
    box-shadow: 0 40px 80px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.04);
  }

  /* subtle ambient tint wash inside frame, keyed to state */
  .frame::before{
    content:"";
    position:absolute;
    inset:0;
    background: radial-gradient(90% 60% at 50% 0%, rgba(var(--glow-idle),0.10), transparent 65%);
    transition: background 0.6s ease;
    pointer-events:none;
  }
  .frame-wrap[data-state="generating"] .frame::before{
    background: radial-gradient(90% 65% at 50% 0%, rgba(var(--glow-generating),0.32), transparent 70%);
  }
  .frame-wrap[data-state="success"] .frame::before{
    background: radial-gradient(90% 65% at 50% 0%, rgba(var(--glow-success),0.32), transparent 70%);
  }
  .frame-wrap[data-state="failure"] .frame::before{
    background: radial-gradient(90% 65% at 50% 0%, rgba(var(--glow-failure),0.32), transparent 70%);
  }

  /* ---------- Header ---------- */
  .header{
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin-bottom: 22px;
  }

  .avatar{
    position: absolute;
    top: -4px;
    right: -2px;
    width: 42px;
    height: 42px;
    border-radius: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--text);
    background: var(--glass-fill);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow: inset 0 1px 0 var(--glass-highlight), 0 6px 16px rgba(0,0,0,0.35);
    cursor: pointer;
  }

  .logo-mark{
    width: 58px;
    height: 58px;
    border-radius: 17px;
    margin-bottom: 12px;
    background: linear-gradient(155deg, #2a1810, #150c07 55%);
    border: 1px solid rgba(255,255,255,0.10);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 8px 20px rgba(0,0,0,0.5);
  }
  .logo-mark svg{ width: 28px; height: 28px; }

  h1{
    font-size: 21px;
    font-weight: 600;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .tagline{
    font-size: 13px;
    color: var(--text-dim);
    margin: 0;
  }

  /* ---------- Glass building block ---------- */
  .glass{
    background: var(--glass-fill);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    backdrop-filter: blur(20px) saturate(150%);
    -webkit-backdrop-filter: blur(20px) saturate(150%);
    box-shadow: inset 0 1px 0 var(--glass-highlight), inset 0 -1px 0 rgba(0,0,0,0.25), 0 10px 24px rgba(0,0,0,0.35);
  }

  .section-label{
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12.5px;
    color: var(--text-dim);
    font-weight: 500;
    margin: 20px 0 8px;
  }
  .section-label svg{ width: 14px; height: 14px; opacity: 0.7; }

  /* ---------- Dropdown ---------- */
  .dropdown{
    padding: 15px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 14.5px;
    cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .dropdown:hover{ background: var(--glass-fill-strong); }
  .dropdown svg{ width: 16px; height: 16px; color: var(--text-dim); }

  /* ---------- Style toggle row ---------- */
  .style-row{
    display: flex;
    gap: 10px;
    margin-top: 10px;
  }
  .style-btn{
    flex: 1;
    padding: 16px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    color: var(--text-dim);
    transition: all 0.2s ease;
  }
  .style-btn svg{ width: 19px; height: 19px; }
  .style-btn.active{
    color: var(--text);
    background: var(--orange-fill);
    border-color: var(--orange-border);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 0 22px rgba(244,147,59,0.22);
  }
  .style-btn.active svg{ color: var(--orange); }

  /* ---------- Cover letter row ---------- */
  .toggle-row{
    margin-top: 14px;
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .toggle-row-left{ display: flex; align-items: center; gap: 12px; }
  .toggle-row-left svg{ width: 19px; height: 19px; color: var(--text-dim); flex-shrink: 0; }
  .toggle-title{ font-size: 14.5px; font-weight: 500; }
  .toggle-sub{ font-size: 12px; color: var(--text-dim); margin-top: 2px; }

  .switch{
    width: 46px;
    height: 27px;
    border-radius: 999px;
    background: var(--orange-fill-strong);
    border: 1px solid var(--orange-border);
    position: relative;
    cursor: pointer;
    flex-shrink: 0;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.3);
  }
  .switch::after{
    content:"";
    position: absolute;
    top: 2px; left: 21px;
    width: 21px; height: 21px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    transition: left 0.2s ease;
  }
  .switch.off{ background: var(--glass-fill); border-color: var(--glass-border); }
  .switch.off::after{ left: 2px; background: rgba(255,255,255,0.7); }

  /* ---------- Generate button (orange glass) ---------- */
  .generate-btn{
    margin-top: 18px;
    width: 100%;
    padding: 17px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    font-size: 15.5px;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    border: 1px solid var(--orange-border);
    background: linear-gradient(160deg, rgba(255,150,60,0.32), rgba(244,110,30,0.18));
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    box-shadow: inset 0 1px 0 rgba(255,210,160,0.45), inset 0 -12px 20px rgba(180,70,10,0.18), 0 0 30px rgba(244,147,59,0.28), 0 10px 26px rgba(0,0,0,0.4);
    transition: transform 0.15s ease, box-shadow 0.3s ease;
  }
  .generate-btn:hover{ transform: translateY(-1px); }
  .generate-btn:active{ transform: translateY(0px) scale(0.99); }
  .generate-btn svg{ width: 17px; height: 17px; }

  .generate-btn.busy{
    cursor: progress;
    box-shadow: inset 0 1px 0 rgba(255,210,160,0.35), 0 0 34px rgba(56,132,255,0.30), 0 10px 26px rgba(0,0,0,0.4);
    border-color: rgba(56,132,255,0.45);
  }

  .spinner{
    width: 15px; height: 15px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.35);
    border-top-color: #fff;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  /* ---------- List rows ---------- */
  .list-row{
    margin-top: 12px;
    padding: 15px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 14.5px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  .list-row:hover{ background: var(--glass-fill-strong); }
  .list-row-left{ display: flex; align-items: center; gap: 12px; }
  .list-row svg{ width: 17px; height: 17px; color: var(--text-dim); }
  .chev{ color: var(--text-faint) !important; }

  /* ---------- Demo controls (outside the mockup) ---------- */
  .demo-controls{
    display: flex;
    gap: 8px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    padding: 8px;
    border-radius: 14px;
    backdrop-filter: blur(10px);
  }
  .demo-controls button{
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 500;
    padding: 8px 14px;
    border-radius: 9px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.05);
    color: rgba(255,255,255,0.7);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .demo-controls button:hover{ background: rgba(255,255,255,0.1); color: #fff; }
  .demo-controls button.active{ background: #fff; color: #000; }
  .demo-note{
    font-size: 12px;
    color: rgba(255,255,255,0.3);
    text-align: center;
    max-width: 380px;
  }
</style>
</head>
<body>

<div class="stage">

  <div class="frame-wrap" id="frameWrap" data-state="idle">
    <div class="glow-layer"></div>

    <div class="frame">
      <div class="header">
        <div class="avatar" title="Profile">CS</div>
        <div class="logo-mark">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 3 L14 3 L20 9 L20 21 L4 21 Z" fill="#f4933b" opacity="0.85"/><path d="M14 3 L20 9 L14 9 Z" fill="#fff" opacity="0.9"/></svg>
        </div>
        <h1>PocketResume</h1>
        <p class="tagline">One Click. One Tailored Resume.</p>
      </div>

      <div class="section-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        Resume style
      </div>
      <div class="glass dropdown">
        <span>Professional (Corporate Standard)</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      </div>

      <div class="style-row">
        <div class="glass style-btn active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 2h9l5 5v15H6z"/><path d="M15 2v5h5"/></svg>
          SWE
        </div>
        <div class="glass style-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 2h9l5 5v15H6z"/><path d="M15 2v5h5"/></svg>
          PM
        </div>
      </div>

      <div class="glass toggle-row">
        <div class="toggle-row-left">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 6l10 7 10-7"/></svg>
          <div>
            <div class="toggle-title">Cover Letter</div>
            <div class="toggle-sub">Also generate a cover letter</div>
          </div>
        </div>
        <div class="switch" id="clSwitch"></div>
      </div>

      <div class="generate-btn" id="generateBtn">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.8 5.6L19 9l-5.2 1.4L12 16l-1.8-5.6L5 9l5.2-1.4z"/></svg>
        <span id="generateLabel">Generate PDF Resume</span>
      </div>

      <div class="glass list-row">
        <div class="list-row-left">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
          Settings
        </div>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 6 15 12 9 18"/></svg>
      </div>

      <div class="glass list-row">
        <div class="list-row-left">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg>
          Job Tracker
        </div>
      </div>

    </div>
  </div>

  <div class="demo-controls" id="demoControls">
    <button data-state="idle" class="active">Idle</button>
    <button data-state="generating">Generating</button>
    <button data-state="success">Success</button>
    <button data-state="failure">Failure</button>
  </div>
  <p class="demo-note">Preview only — click a state above to see the ambient background glow react. Not part of the extension itself.</p>

</div>

<script>
  const frameWrap = document.getElementById('frameWrap');
  const genBtn = document.getElementById('generateBtn');
  const genLabel = document.getElementById('generateLabel');
  const buttons = document.querySelectorAll('#demoControls button');
  const clSwitch = document.getElementById('clSwitch');

  clSwitch.addEventListener('click', () => clSwitch.classList.toggle('off'));

  function setState(state){
    frameWrap.setAttribute('data-state', state);
    buttons.forEach(b => b.classList.toggle('active', b.dataset.state === state));

    genBtn.classList.remove('busy');
    genBtn.innerHTML = '';

    if(state === 'generating'){
      genBtn.classList.add('busy');
      genBtn.innerHTML = '<div class="spinner"></div><span>Generating…</span>';
    } else if(state === 'success'){
      genBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="20 6 9 17 4 12"/></svg><span>Done — PDF ready</span>';
    } else if(state === 'failure'){
      genBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg><span>Failed — try again</span>';
    } else {
      genBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.8 5.6L19 9l-5.2 1.4L12 16l-1.8-5.6L5 9l5.2-1.4z"/></svg><span>Generate PDF Resume</span>';
    }
  }

  buttons.forEach(b => b.addEventListener('click', () => setState(b.dataset.state)));
  genBtn.addEventListener('click', () => {
    if(frameWrap.dataset.state === 'generating') return;
    setState('generating');
    setTimeout(() => setState(Math.random() > 0.25 ? 'success' : 'failure'), 1800);
    setTimeout(() => setState('idle'), 4200);
  });
</script>

</body>
</html>
